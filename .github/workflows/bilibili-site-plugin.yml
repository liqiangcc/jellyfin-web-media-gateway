name: bilibili-site-plugin

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'site-adapter-api/**'
      - 'plugins/bilibili/**'
      - 'gateway-core/src/lib.rs'
      - 'gateway-core/src/source_session.rs'
      - '.github/workflows/bilibili-site-plugin.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact candidate commit to verify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bilibili-site-plugin-${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}

jobs:
  contract:
    name: hosted x64 Bilibili contract and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact Candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Plugin and API conformance/security tests
        run: |
          cargo test -p site-adapter-api --all-targets -- --nocapture
          cargo test -p bilibili --all-targets -- --nocapture
      - name: SourceSession observation handoff and existing playback regressions
        run: |
          cargo test -p gateway-core --lib source_session::tests::browser_observation_handoff_enters_source_session_without_secret_projection -- --exact --nocapture
          cargo test -p gateway-core --test playback_concurrency -- --nocapture
          cargo test -p gateway-core --test http_security -- --nocapture
          cargo test -p gateway-core --test security_baseline -- --nocapture

  architecture:
    name: hosted x64 architecture and public-boundary checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact Candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Core and Browser Worker remain site agnostic
        shell: bash
        run: |
          if git grep -n -i -E 'bilibili|sessdata|BV[0-9A-Za-z]{10}' -- gateway-core/src; then
            echo 'concrete Bilibili knowledge leaked into Core or Browser Worker' >&2
            exit 1
          fi
          if git grep -n -E '^\s*pub\s+[A-Za-z0-9_]+\s*:\s*.*(resolved_media|upstream_access_ref|Cookie|Authorization|Bearer)' -- gateway-core/src/control_view.rs gateway-core/src/control.rs; then
            exit 1
          fi
      - name: Plugin is the only owner of Bilibili semantics
        run: |
          test -f plugins/bilibili/src/lib.rs
          git grep -n -E 'BilibiliAdapter|LOCATOR_VERSION|BrowserObservation|ServerOwnedObservation' -- plugins/bilibili/src/lib.rs
