name: site-navigation-prep

on:
  pull_request:
    paths:
      - ".github/workflows/site-navigation-prep.yml"
      - "site-adapter-api/**"
      - "gateway-core/src/playback.rs"
      - "gateway-core/src/source_session.rs"
      - "gateway-core/src/control.rs"
      - "gateway-core/src/lib.rs"
      - "gateway-core/tests/playback_concurrency.rs"
      - "gateway-core/src/control_contract_tests.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check-core-site-boundary.sh"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: site-navigation-prep-${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}

jobs:
  j1-navigation-contract:
    name: J1 SiteAdapter navigation and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact Candidate SHA
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Run navigation contract and existing conformance
        run: |
          cargo fmt --all -- --check
          cargo test -p site-adapter-api --all-targets -- --nocapture
          cargo test -p generic-direct --all-targets -- --nocapture

  j2-preparation-stale:
    name: J2 preparation and stale-result matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact Candidate SHA
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run deterministic preparation and stale-result tests
        run: |
          cargo test -p gateway-core --lib source_session::tests::navigation_prepares_before_commit_and_reuses_control_authority -- --exact --nocapture
          cargo test --test playback_concurrency navigation_ -- --nocapture
          cargo test --test playback_concurrency stale_item_callback_is_ignored -- --exact --nocapture
          cargo test --test playback_concurrency stale_media_resolve_result_is_ignored -- --exact --nocapture

  j3-command-authority:
    name: J3 command CAS and idempotency authority
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact Candidate SHA
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run Playback and HTTP command authority tests
        run: |
          cargo test --test playback_concurrency -- --nocapture
          cargo test -p gateway-core --lib control_contract_tests::http_commands_preserve_r007_idempotency_cas_and_event_semantics -- --exact --nocapture
          cargo test -p gateway-core --lib control_contract_tests::two_controls_through_http_cannot_commit_against_one_old_revision -- --exact --nocapture

  j4-regressions:
    name: J4 workspace and architecture regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact Candidate SHA
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Run exact-Candidate workspace and accepted-boundary regressions
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          bash scripts/check-core-site-boundary.sh
          cargo test -p gateway-core --test security_baseline -- --nocapture
