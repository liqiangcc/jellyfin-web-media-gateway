name: control-shell

on:
  push:
    branches:
      - "worker/**"
  pull_request:
    paths:
      - ".github/workflows/control-shell.yml"
      - "gateway-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: control-shell-${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}

jobs:
  j1-control-contracts:
    name: J1 deterministic Control/session contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Snapshot, command, reconnect, and telemetry contracts
        run: |
          cargo test -p gateway-core --test control_contract sessions_are_isolated_and_snapshot_is_canonical_non_secret_view -- --exact
          cargo test -p gateway-core --test control_contract http_commands_preserve_r007_idempotency_cas_and_event_semantics -- --exact
          cargo test -p gateway-core --test control_contract reconnect_requires_snapshot_when_cursor_history_is_expired -- --exact
          cargo test -p gateway-core --test control_contract telemetry_updates_observation_without_command_revision_and_rejects_stale_callbacks -- --exact

  j2-control-negatives:
    name: J2 Control concurrency and security negatives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Concurrent CAS and deterministic rejection tests
        run: |
          cargo test -p gateway-core --test control_contract two_controls_through_http_cannot_commit_against_one_old_revision -- --exact
          cargo test -p gateway-core --test control_contract command_input_is_bounded_structured_and_does_not_accept_url_authority -- --exact
      - name: Existing HTTP and security boundary regressions
        run: |
          cargo test -p gateway-core --test http_security
          cargo test -p gateway-core --test security_baseline

  j3-workspace-regressions:
    name: J3 workspace and affected authority regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Workspace and accepted authority regressions
        run: |
          cargo test --workspace --all-targets
          cargo test -p gateway-core --test playback_concurrency
          cargo test -p gateway-core --test media_gateway
          cargo test -p gateway-core --test auth_contract
