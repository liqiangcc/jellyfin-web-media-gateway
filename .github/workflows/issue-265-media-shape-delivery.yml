name: issue-265-media-shape-delivery

on:
  push:
    branches:
      - "worker/issue-265-media-shape"
  pull_request:
    paths:
      - "site-adapter-api/**"
      - "plugins/bilibili/**"
      - "gateway-core/**"
      - "scripts/r005_media_shape_harness.py"
      - "docs/research/r005-media-shape-delivery-decision.md"
      - ".github/workflows/issue-265-media-shape-delivery.yml"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: issue-265-media-shape-delivery-${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}

jobs:
  static:
    name: Issue 265 J1 hosted x64 static shape and boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate exact candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert candidate and hosted x64
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(uname -m)" = x86_64
      - name: Run source-gap harness
        run: python3 scripts/r005_media_shape_harness.py --mode static

  synthetic:
    name: Issue 265 J2 hosted x64 synthetic shape and refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate exact candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert candidate and hosted x64
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(uname -m)" = x86_64
      - name: Run synthetic shape checks
        run: python3 scripts/r005_media_shape_harness.py --mode synthetic
      - name: Run refresh/CAS checks
        run: python3 scripts/r005_media_shape_harness.py --mode refresh

  compatibility:
    name: Issue 265 J3 hosted x64 compatibility and provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate exact candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert candidate and hosted x64
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(uname -m)" = x86_64
      - name: Run bounded compatibility model
        run: python3 scripts/r005_media_shape_harness.py --mode compatibility
      - name: Create redacted provenance artifact
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          evidence_dir="$GITHUB_WORKSPACE/issue-265-j3-evidence"
          mkdir -p "$evidence_dir"
          sha256sum             scripts/r005_media_shape_harness.py             docs/research/r005-media-shape-delivery-decision.md             .github/workflows/issue-265-media-shape-delivery.yml             > "$evidence_dir/source-sha256sums.txt"
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "git_head=$(git rev-parse HEAD)"
            echo "runner_arch=$(uname -m)"
            echo "evidence_scope=generic-media-shape-and-refresh"
            echo "secret_policy=redacted-only"
            echo "network_policy=no-network-harness"
          } > "$evidence_dir/manifest.txt"
          python3 scripts/r005_media_shape_harness.py --mode compatibility > "$evidence_dir/result.json"
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "static_source_boundary=PASS"
            echo "synthetic_shape_pairing=PASS"
            echo "refresh_cas=PASS"
            echo "compatibility_route_model=PASS"
          } > "$evidence_dir/guard.log"
      - name: Verify artifact boundary and exact provenance
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          evidence_dir="$GITHUB_WORKSPACE/issue-265-j3-evidence"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          grep -Fx "candidate_sha=$CANDIDATE_SHA" "$evidence_dir/manifest.txt"
          grep -Fx "git_head=$CANDIDATE_SHA" "$evidence_dir/manifest.txt"
          grep -Fx "candidate_sha=$CANDIDATE_SHA" "$evidence_dir/guard.log"
          (cd "$GITHUB_WORKSPACE" && sha256sum -c issue-265-j3-evidence/source-sha256sums.txt)
          if grep -Eiq 'https?://|cookie|authorization|bearer|signed[-_ ]?url|sessdata|profile|raw media|media bytes' "$evidence_dir" --exclude='source-sha256sums.txt'; then
            echo "R005 artifact contains forbidden URL, secret, profile, or raw media material" >&2
            exit 1
          fi
          if grep -Eiq 'Bilibili|BV[0-9A-Za-z]{8,}|tx-node|VNC|CDP' "$evidence_dir" --exclude='source-sha256sums.txt'; then
            echo "R005 artifact contains live-site or forbidden target vocabulary" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-265-j3-evidence-${{ env.CANDIDATE_SHA }}
          path: issue-265-j3-evidence
          if-no-files-found: error
          retention-days: 14
