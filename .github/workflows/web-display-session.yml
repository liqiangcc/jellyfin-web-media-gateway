name: web-display-session

on:
  push:
    branches:
      - "worker/**"
  pull_request:
    paths:
      - ".github/workflows/web-display-session.yml"
      - "gateway-core/**"
      - "display-adapter-api/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web-display-session-${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}

jobs:
  j1-web-display-contracts:
    name: J1 Web Display registration lease context contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Registration heartbeat reconnect and context contracts
        run: |
          cargo fmt --all -- --check
          cargo test -p gateway-core display_session::tests::registration_heartbeat_and_context_are_server_owned_and_bounded -- --exact
          cargo test -p gateway-core display_session::tests::reconnect_supersedes_old_lease_and_rejects_old_callback -- --exact
          cargo test -p gateway-core display_session::tests::expired_lease_is_offline_and_cannot_be_renewed -- --exact

  j2-web-display-negatives:
    name: J2 Web Display stale callback and HTTP security negatives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Stale matrix candidate isolation and HTTP boundary
        run: |
          cargo test -p gateway-core display_session::tests::stale_context_matrix_is_rejected_before_side_effects -- --exact
          cargo test -p gateway-core display_session::tests::current_position_callback_routes_through_r007_and_candidate_cannot_commit -- --exact
          cargo test -p gateway-core display_session::tests::accepted_control_view_consumes_generic_web_display_facts_without_branching -- --exact
          cargo test -p gateway-core control_contract_tests::web_display_http_registration_lease_context_and_callback_are_generation_safe -- --exact
          cargo test -p gateway-core control_contract_tests::web_display_http_routes_reuse_origin_and_body_security -- --exact
          cargo test -p gateway-core --test http_security

  j3-workspace-regressions:
    name: J3 workspace and accepted authority regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Workspace and affected authority regressions
        run: |
          cargo test --workspace --all-targets
          cargo test -p gateway-core --test playback_concurrency
          cargo test -p gateway-core --test media_gateway
          cargo test -p gateway-core --test auth_contract
          cargo test -p gateway-core --test security_baseline
