name: control-view

on:
  pull_request:
    paths:
      - ".github/workflows/control-view.yml"
      - "gateway-core/**"
      - "display-adapter-api/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - "worker/**"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: control-view-${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}

jobs:
  j1-projection-rebuild:
    name: J1 projection and rebuild contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Format, lint, and projection contracts
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p gateway-core control_view::tests::projection_is_read_only_safe_and_preserves_domain_freshness -- --exact
          cargo test -p gateway-core control_view::tests::reconnect_rebuild_from_fresh_snapshots_is_equal_without_history -- --exact

  j2-isolation-security:
    name: J2 failure isolation freshness and Secret negatives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Isolation precedence freshness and redaction contracts
        run: |
          cargo test -p gateway-core control_view::tests::action_precedence_is_deterministic_and_does_not_reset_playback -- --exact
          cargo test -p gateway-core control_view::tests::independent_failures_keep_unrelated_sections_available -- --exact
          cargo test -p gateway-core control_view::tests::pending_intent_and_sensitive_source_boundaries_are_redacted -- --exact
          cargo test -p gateway-core control_view::tests::handoff_is_projected_as_domain_state_and_controls_are_derived -- --exact
          cargo test -p gateway-core control_view::tests::display_instance_must_match_current_active_display_identity -- --exact
          cargo test -p gateway-core control_view::tests::stale_or_mismatched_display_status_cannot_overwrite_observation -- --exact
          cargo test -p gateway-core control_view::tests::stale_contextual_display_error_cannot_create_current_action_required -- --exact
          cargo test -p gateway-core control_view::tests::freshness_comparison_rejects_cross_session_views -- --exact
          cargo test -p gateway-core --test http_security
          cargo test -p gateway-core --test security_baseline

  j3-regressions:
    name: J3 workspace and accepted authority regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Workspace and affected authority regressions
        run: |
          cargo test --workspace --all-targets
          cargo test -p gateway-core --test playback_concurrency
          cargo test -p gateway-core --test media_gateway
          cargo test -p gateway-core --test auth_contract
