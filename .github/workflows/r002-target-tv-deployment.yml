name: r002-target-tv-deployment

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact approved candidate commit SHA"
        required: true
        type: string
      hold_minutes:
        description: "Bounded manual-TV deployment window"
        required: true
        type: choice
        options:
          - 45
          - 75
          - 90

permissions:
  contents: read

concurrency:
  group: r002-target-tv-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Trusted bounded R002 TV deployment
    runs-on: [self-hosted, linux, ARM64, ubuntu-arm64, target-device]
    timeout-minutes: 105
    steps:
      - name: Validate trusted dispatch inputs
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          HOLD_MINUTES: ${{ inputs.hold_minutes }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "candidate_sha must be a full 40-character hexadecimal commit SHA"
            exit 1
          fi
          case "$HOLD_MINUTES" in
            45|75|90) ;;
            *) echo "hold_minutes must be one of 45, 75, or 90"; exit 1 ;;
          esac

      - name: Checkout trusted workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .trusted-workflow
          fetch-depth: 1

      - name: Checkout approved candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: .candidate
          fetch-depth: 1

      - name: Start and hold bounded LAN deployment
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          HOLD_MINUTES: ${{ inputs.hold_minutes }}
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [[ "$(id -u)" -eq 0 ]]; then
            echo "target deployment must not run as root"
            exit 1
          fi

          candidate_dir="$GITHUB_WORKSPACE/.candidate"
          trusted_dir="$GITHUB_WORKSPACE/.trusted-workflow"
          test -d "$candidate_dir" && test -d "$trusted_dir"
          test "$(git -C "$candidate_dir" rev-parse HEAD)" = "$(printf '%s' "$CANDIDATE_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$(git -C "$trusted_dir" rev-parse HEAD)" = "$(printf '%s' "$TRUSTED_WORKFLOW_SHA" | tr '[:upper:]' '[:lower:]')"

          runtime_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/r002-target-tv.XXXXXX")"
          diagnostics_dir="$GITHUB_WORKSPACE/.r002-target-tv-artifacts"
          mkdir -p "$diagnostics_dir"

          cleanup() {
            rc=$?
            trap - EXIT INT TERM
            if [[ -n "${server_pid:-}" ]] && kill -0 "$server_pid" >/dev/null 2>&1; then
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" >/dev/null 2>&1 || true
            fi
            if [[ -f "$runtime_dir/server.log" ]]; then
              cp -- "$runtime_dir/server.log" "$diagnostics_dir/server.log" || true
            fi
            rm -rf -- "$runtime_dir"
            exit "$rc"
          }
          trap cleanup EXIT INT TERM

          test "$runtime_dir" != "$GITHUB_WORKSPACE"
          case "$runtime_dir" in
            "${RUNNER_TEMP:-/tmp}/r002-target-tv."*) ;;
            *) echo "runtime directory is not isolated under runner temp"; exit 1 ;;
          esac

          test_port=18788
          default_route_iface="$(ip -4 route show default 0.0.0.0/0 | awk 'NR == 1 {print $5; exit}')"
          if [[ -z "$default_route_iface" ]]; then
            echo "no normal IPv4 default route interface found"
            exit 1
          fi
          bind_addr="$(ip -4 -o addr show dev "$default_route_iface" scope global | awk 'NR == 1 {split($4, octets, "/"); print octets[1]; exit}')"

          is_private_ipv4() {
            local address=$1
            [[ "$address" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || return 1
            IFS=. read -r a b c d <<<"$address"
            (( a <= 255 && b <= 255 && c <= 255 && d <= 255 )) || return 1
            if (( a == 10 )); then return 0; fi
            if (( a == 172 && b >= 16 && b <= 31 )); then return 0; fi
            if (( a == 192 && b == 168 )); then return 0; fi
            return 1
          }

          if ! is_private_ipv4 "$bind_addr"; then
            echo "default route did not provide an acceptable private LAN IPv4: ${bind_addr:-none}"
            exit 1
          fi

          export CARGO_TARGET_DIR="$runtime_dir/cargo-target"
          cargo build --manifest-path "$candidate_dir/Cargo.toml" --bin r001-server
          server_binary="$CARGO_TARGET_DIR/debug/r001-server"
          test -x "$server_binary"

          start_utc="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          end_utc="$(date -u -d "+${HOLD_MINUTES} minutes" '+%Y-%m-%dT%H:%M:%SZ')"
          display_entry="http://${bind_addr}:${test_port}/display"
          control_entry="http://${bind_addr}:${test_port}/control"
          {
            echo "trusted_workflow_sha=$TRUSTED_WORKFLOW_SHA"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_labels=self-hosted,linux,ARM64,ubuntu-arm64,target-device"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "target_bind_addr=$bind_addr"
            echo "port=$test_port"
            echo "display_entry=$display_entry"
            echo "control_entry=$control_entry"
            echo "start_utc=$start_utc"
            echo "planned_end_utc=$end_utc"
          } | tee "$runtime_dir/deployment-metadata.txt" "$diagnostics_dir/deployment-metadata.txt"

          (
            cd "$candidate_dir"
            exec env R001_BIND_ADDR="$bind_addr" R001_PORT="$test_port" "$server_binary"
          ) >"$runtime_dir/server.log" 2>&1 &
          server_pid=$!

          ready=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$server_pid" >/dev/null 2>&1; then
              echo "R001 server exited before self-smoke"
              cat "$runtime_dir/server.log"
              exit 1
            fi
            if curl --fail --silent --show-error "http://${bind_addr}:${test_port}/healthz" >/dev/null \
              && curl --fail --silent --show-error "http://${bind_addr}:${test_port}/display" >/dev/null \
              && curl --fail --silent --show-error "http://${bind_addr}:${test_port}/control" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "LAN deployment self-smoke failed"
            cat "$runtime_dir/server.log"
            exit 1
          fi

          cat "$runtime_dir/deployment-metadata.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "deployment_ready=true" | tee -a "$runtime_dir/deployment-metadata.txt" "$diagnostics_dir/deployment-metadata.txt"

          hold_seconds=$((HOLD_MINUTES * 60))
          for ((elapsed=0; elapsed<hold_seconds; elapsed+=10)); do
            if ! kill -0 "$server_pid" >/dev/null 2>&1; then
              echo "R001 server exited during bounded hold window"
              cat "$runtime_dir/server.log"
              exit 1
            fi
            if ! curl --fail --silent --show-error "http://${bind_addr}:${test_port}/healthz" >/dev/null; then
              echo "R001 server health check failed during bounded hold window"
              cat "$runtime_dir/server.log"
              exit 1
            fi
            sleep 10
          done
          echo "bounded deployment window complete"

      - name: Upload non-secret deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r002-target-tv-deployment
          path: .r002-target-tv-artifacts
          if-no-files-found: ignore

      - name: Remove diagnostic workspace
        if: always()
        shell: bash --noprofile --norc -euo pipefail {0}
        run: rm -rf -- "$GITHUB_WORKSPACE/.r002-target-tv-artifacts" "$GITHUB_WORKSPACE/.candidate" "$GITHUB_WORKSPACE/.trusted-workflow"
