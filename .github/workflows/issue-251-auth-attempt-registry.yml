name: issue-251-auth-attempt-registry

on:
  pull_request:
    paths:
      - "gateway-core/src/auth_attempt_registry.rs"
      - "gateway-core/src/browser_auth.rs"
      - "gateway-core/src/browser.rs"
      - "gateway-core/src/lib.rs"
      - ".github/workflows/issue-251-auth-attempt-registry.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: issue-251-auth-attempt-registry-${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}

jobs:
  hosted-x64:
    name: Issue 251 auth attempt registry hosted x64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Assert exact candidate SHA and hosted x64
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(uname -m)" = x86_64
          rustc_info="$(rustc -vV)"
          [[ "$rustc_info" == *'host: x86_64-unknown-linux-gnu'* ]]
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Focused registry clippy
        run: cargo clippy -p gateway-core --lib -- -D warnings
      - name: Focused registry tests
        run: cargo test -p gateway-core --lib auth_attempt_registry::tests -- --test-threads=1
