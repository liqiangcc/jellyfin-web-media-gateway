name: issue-251-gateway-auth-route

on:
  push:
    branches:
      - "worker/issue-251-gateway-auth-route"
  pull_request:
    paths:
      - "gateway-core/**"
      - "site-adapter-api/**"
      - ".github/workflows/issue-251-gateway-auth-route.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: issue-251-gateway-auth-route-${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}

jobs:
  hosted-x64:
    name: Issue 251 hosted x64 fmt clippy tests and guards
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Assert exact candidate SHA and hosted x64
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(uname -m)" = x86_64
          rustc_info="$(rustc -vV)"
          [[ "$rustc_info" == *'host: x86_64-unknown-linux-gnu'* ]]
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-targets -- --test-threads=1
      - name: Architecture and secret-boundary guards
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          bash scripts/check-core-site-boundary.sh --self-test
          if git grep -n -i -E 'bilibili|sessdata|BV[0-9A-Za-z]{10,}' -- gateway-core/src; then
            echo 'concrete site knowledge leaked into Gateway Core' >&2
            exit 1
          fi
          if git grep -n -E '^\s*pub\s+[A-Za-z0-9_]+\s*:\s*.*(upstream_access_ref|resolved_media|Cookie|Authorization|Bearer)' -- gateway-core/src/control.rs gateway-core/src/control_view.rs; then
            echo 'secret or upstream media state crossed the Control boundary' >&2
            exit 1
          fi
