name: r008-security

on:
  pull_request:
    paths:
      - ".github/workflows/r008-security.yml"
      - "gateway-core/**"
      - "gateway-egress/**"
      - "site-adapter-api/**"
      - "plugins/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/adr/0007-r008-anonymous-response-secret-containment.md"
      - "docs/security.md"
      - "docs/research/r008-security-boundary.md"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: r008-security-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}

jobs:
  j1-response-policy:
    name: J1 R008 response policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run deterministic response and Secret classifier fixtures
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          cargo test -p gateway-egress --all-targets -- --nocapture 2>&1 | tee gateway-egress-test.log
          cargo test -p site-adapter-api --all-targets -- --nocapture 2>&1 | tee site-adapter-api-test.log
          ! rg -n 'fixture-(set-cookie|basic|bearer|api-key|overflow)-secret' \
            gateway-egress-test.log site-adapter-api-test.log

  j2-state-redirect-negatives:
    name: J2 state redirect and security negatives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run request, replay, redirect, bounds and malformed suites
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          cargo test -p gateway-egress --all-targets -- --nocapture 2>&1 | tee gateway-egress-negative.log
          cargo test -p gateway-core --test security_baseline -- --nocapture 2>&1 | tee security-test.log
          cargo test -p gateway-core --test http_security -- --nocapture 2>&1 | tee http-security-test.log
          cargo test -p gateway-core --test auth_contract -- --nocapture 2>&1 | tee auth-contract-test.log
          cargo test -p gateway-core --test media_gateway -- --nocapture 2>&1 | tee media-test.log
      - name: Verify fixture output contains no secret sentinel
        run: |
          ! rg -n 'fixture-(set-cookie|basic|bearer|api-key|overflow)-secret|r008-fixture-secret|fixture-test-secret|r001-fixture-secret' \
            gateway-egress-negative.log security-test.log http-security-test.log auth-contract-test.log media-test.log

  j3-broker-regressions:
    name: J3 broker runtime and workspace regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact-Candidate workspace and broker regressions
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo test -p generic-ytdlp --features runtime-prep --test runtime r008_broker_rejects_secret_userinfo_and_private_targets_before_network -- --nocapture
          python -m py_compile plugins/generic-ytdlp/worker/worker.py
      - name: Verify broker architecture and production default remain bounded
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          grep -q 'R008Broker' gateway-egress/src/lib.rs
          grep -q 'Arc::new(DisabledRunner)' plugins/generic-ytdlp/src/lib.rs
          grep -q 'set-cookie' site-adapter-api/src/security.rs
          grep -q 'is_secret_header' gateway-egress/src/lib.rs
          grep -q 'response Secret' docs/security.md
          bash scripts/check-core-site-boundary.sh
          bash scripts/check-core-site-boundary.sh --self-test
