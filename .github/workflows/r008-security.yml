name: r008-security

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: r008-security-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  j1-regression:
    name: J1 workspace and security regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Format, lint, and run workspace tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets

  j2-security-fixtures:
    name: J2 deterministic security fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Run security fixture and media replay suites
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          cargo test -p gateway-core --test security_baseline -- --nocapture 2>&1 | tee security-test.log
          cargo test -p gateway-core --test media_gateway -- --nocapture 2>&1 | tee media-test.log
      - name: Verify fixture output contains no secret sentinel
        run: |
          ! rg -n 'r008-fixture-secret|fixture-test-secret|r001-fixture-secret' \
            security-test.log media-test.log

  j3-workflow-trust:
    name: J3 target workflow trust and deferred boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Run repository workflow trust checks
        run: cargo test -p gateway-core --test security_baseline -- --nocapture
