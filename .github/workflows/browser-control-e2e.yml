name: browser-control-e2e

on:
  pull_request:
    paths:
      - "gateway-core/**"
      - "plugins/generic-direct/**"
      - "site-adapter-api/**"
      - "scripts/web-mvp-e2e-prep.mjs"
      - ".github/workflows/browser-control-e2e.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: browser-control-e2e-${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
  E2E_SOURCE: https://example.test/deterministic-generic-direct.mp4

jobs:
  j1-hosted-baseline:
    name: J1 hosted build and browser baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the exact Candidate on GitHub-hosted Actions
        run: cargo build -p gateway-core --bin r001-server
      - name: Create deterministic local media fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p browser-control-bundle
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x180:rate=24 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart browser-control-bundle/fixture.mp4
          cp target/debug/r001-server browser-control-bundle/r001-server
          (cd browser-control-bundle && sha256sum r001-server fixture.mp4 > SHA256SUMS)
          printf '{"candidate_sha":"%s","run_id":"%s","runner":"github-hosted/ubuntu-latest","target":"loopback Gateway","browser":"isolated Playwright Chromium","fixture":"deterministic generic-direct"}\n' "$CANDIDATE_SHA" "$GITHUB_RUN_ID" > browser-control-bundle/candidate-artifact-manifest.json
      - name: Run J1 browser Control to Display journey
        shell: bash
        run: |
          trap 'if [[ -f server.pid ]]; then kill "$(cat server.pid)" 2>/dev/null || true; fi' EXIT
          R001_FIXTURE_MP4="$GITHUB_WORKSPACE/browser-control-bundle/fixture.mp4" R002_USE_FIXTURE_DISPLAY=1 ./browser-control-bundle/r001-server >server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/healthz >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/healthz >/dev/null
          npm install --no-save playwright-core@1.55.0
          BASE_URL=http://127.0.0.1:8787 WEB_MVP_SOURCE="$E2E_SOURCE" node scripts/web-mvp-e2e-prep.mjs
          ! grep -Eiq 'Bearer[[:space:]]+|Cookie|Authorization|r001-fixture-secret|resolved_media|upstream_access_ref|/tmp/' web-mvp-e2e-proof.json server.log
          cp web-mvp-e2e-proof.json browser-control-bundle/j1-proof.json
      - name: Upload exact Candidate runtime artifact and redacted J1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-control-e2e-runtime-${{ env.CANDIDATE_SHA }}
          if-no-files-found: error
          path: |
            browser-control-bundle

  j2-browser-loop:
    name: J2 artifact-backed isolated browser loop
    needs: j1-hosted-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: browser-control-e2e-runtime-${{ env.CANDIDATE_SHA }}
          path: browser-control-bundle
      - name: Verify and consume the exact Candidate artifact
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          jq -e --arg sha "$CANDIDATE_SHA" '.candidate_sha == $sha and .target == "loopback Gateway"' browser-control-bundle/candidate-artifact-manifest.json >/dev/null
          (cd browser-control-bundle && sha256sum -c SHA256SUMS)
          chmod +x browser-control-bundle/r001-server
      - name: Run J2 browser Control/Display loop from the verified artifact
        shell: bash
        run: |
          trap 'if [[ -f server.pid ]]; then kill "$(cat server.pid)" 2>/dev/null || true; fi' EXIT
          R001_FIXTURE_MP4="$GITHUB_WORKSPACE/browser-control-bundle/fixture.mp4" R002_USE_FIXTURE_DISPLAY=1 ./browser-control-bundle/r001-server >server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/healthz >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/healthz >/dev/null
          npm install --no-save playwright-core@1.55.0
          BASE_URL=http://127.0.0.1:8787 WEB_MVP_SOURCE="$E2E_SOURCE" node scripts/web-mvp-e2e-prep.mjs
          ! grep -Eiq 'Bearer[[:space:]]+|Cookie|Authorization|r001-fixture-secret|resolved_media|upstream_access_ref|/tmp/' web-mvp-e2e-proof.json server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-control-e2e-j2-${{ env.CANDIDATE_SHA }}
          if-no-files-found: error
          path: web-mvp-e2e-proof.json

  j3-regressions:
    name: J3 accepted authority and security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Run exact-Candidate workspace and authority matrix
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo test -p gateway-core --test playback_concurrency
          cargo test -p gateway-core --test media_gateway
          cargo test -p gateway-core --test http_security
          cargo test -p gateway-core --test security_baseline
          bash scripts/check-core-site-boundary.sh

  j4-repro-cleanup:
    name: J4 artifact reproducibility and cleanup
    needs: j2-browser-loop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Consume the same exact runtime artifact for the second run
        uses: actions/download-artifact@v4
        with:
          name: browser-control-e2e-runtime-${{ env.CANDIDATE_SHA }}
          path: browser-control-bundle
      - name: Verify provenance and absence of copied credentials
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          jq -e --arg sha "$CANDIDATE_SHA" '.candidate_sha == $sha and .browser == "isolated Playwright Chromium"' browser-control-bundle/candidate-artifact-manifest.json >/dev/null
          (cd browser-control-bundle && sha256sum -c SHA256SUMS)
          ! find browser-control-bundle -type f \( -name '*cookie*' -o -name '*profile*' -o -name '*token*' \) -print -quit | grep -q .
          chmod +x browser-control-bundle/r001-server
      - name: Re-run the browser journey without compilation
        shell: bash
        run: |
          trap 'if [[ -f server.pid ]]; then kill "$(cat server.pid)" 2>/dev/null || true; fi; rm -f server.pid' EXIT
          R001_FIXTURE_MP4="$GITHUB_WORKSPACE/browser-control-bundle/fixture.mp4" R002_USE_FIXTURE_DISPLAY=1 ./browser-control-bundle/r001-server >server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/healthz >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/healthz >/dev/null
          npm install --no-save playwright-core@1.55.0
          BASE_URL=http://127.0.0.1:8787 WEB_MVP_SOURCE="$E2E_SOURCE" node scripts/web-mvp-e2e-prep.mjs
          ! grep -Eiq 'Bearer[[:space:]]+|Cookie|Authorization|r001-fixture-secret|resolved_media|upstream_access_ref|/tmp/' web-mvp-e2e-proof.json server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-control-e2e-j4-${{ env.CANDIDATE_SHA }}
          if-no-files-found: error
          path: web-mvp-e2e-proof.json
