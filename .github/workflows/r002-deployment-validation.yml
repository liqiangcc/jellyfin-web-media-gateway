name: r002-deployment-validation

on:
  pull_request:
    paths:
      - 'gateway-core/**'
      - 'scripts/validate-r002-target-deployment.mjs'
      - '.github/workflows/r002-target-tv-deployment.yml'
      - '.github/workflows/r002-deployment-validation.yml'
  push:
    branches: [main]
    paths:
      - 'gateway-core/**'
      - 'scripts/validate-r002-target-deployment.mjs'
      - '.github/workflows/r002-target-tv-deployment.yml'
      - '.github/workflows/r002-deployment-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  j1-bind-and-regression:
    name: J1 bind configuration and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Runtime versions
        run: rustc --version && cargo --version && uname -a
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Bind configuration and affected regression tests
        run: cargo test --workspace --all-targets

  j2-workflow-contract:
    name: J2 trusted workflow contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate target workflow statically
        run: node scripts/validate-r002-target-deployment.mjs
