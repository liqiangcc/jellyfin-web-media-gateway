name: r001-media-path

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'gateway-core/**'
      - 'site-adapter-api/**'
      - 'plugins/generic-direct/**'
      - 'scripts/browser-proof.mjs'
      - '.github/workflows/r001-media-path.yml'
      - 'docs/**'

permissions:
  contents: read

jobs:
  deterministic:
    name: J1 deterministic x64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Versions
        run: rustc --version && cargo --version && uname -a
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and contract tests
        run: cargo test --workspace --all-targets

  browser:
    name: J2 Chromium MP4 play-pause-seek + secret boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Runtime versions
        run: |
          rustc --version
          google-chrome --version
          ffmpeg -version | head -1
          node --version
      - name: Build gateway
        run: cargo build -p gateway-core --bin r001-server
      - name: Generate protected deterministic MP4 fixture
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x180:rate=24 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/r001-fixture.mp4
          test -s /tmp/r001-fixture.mp4
      - name: Start R001 proof server
        run: |
          R001_FIXTURE_MP4=/tmp/r001-fixture.mp4 ./target/debug/r001-server >server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/healthz && exit 0; sleep 1; done
          cat server.log
          exit 1
      - name: Browser proof
        run: |
          npm install --no-save playwright-core@1.55.0
          BASE_URL=http://127.0.0.1:8787 node scripts/browser-proof.mjs
      - name: Verify no secret leaked to artifacts/log
        run: |
          ! grep -R "r001-fixture-secret" browser-proof.json server.log
          curl -fsS http://127.0.0.1:8787/metrics | tee metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r001-browser-proof
          path: |
            browser-proof.json
            metrics.json
            server.log

  public-smoke:
    name: J3 public MP4 + HLS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build and start
        run: |
          cargo build -p gateway-core --bin r001-server
          ./target/debug/r001-server >server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/healthz && break; sleep 1; done
      - name: Public MP4 Range smoke
        run: |
          curl -fsS http://127.0.0.1:8787/proof/paths > paths.json
          MP4=$(python3 -c 'import json; print(json.load(open("paths.json"))["mp4_path"])')
          CODE=$(curl -sS -o mp4-range.bin -D mp4-headers.txt -w '%{http_code}' -H 'Range: bytes=0-1023' "http://127.0.0.1:8787${MP4}")
          test "$CODE" = 206
          test "$(wc -c < mp4-range.bin)" = 1024
          grep -qi '^content-range: bytes 0-1023/' mp4-headers.txt
      - name: Public HLS manifest-variant-segment smoke
        run: |
          HLS=$(python3 -c 'import json; print(json.load(open("paths.json"))["hls_path"])')
          curl -fsS "http://127.0.0.1:8787${HLS}" > master.m3u8
          grep -q '/stream/' master.m3u8
          ! grep -q 'devstreaming-cdn.apple.com' master.m3u8
          VARIANT=$(grep -v '^#' master.m3u8 | sed '/^$/d' | head -1)
          curl -fsS "http://127.0.0.1:8787${VARIANT}" > variant.m3u8
          SEGMENT=$(grep -v '^#' variant.m3u8 | sed '/^$/d' | head -1)
          curl -fsS "http://127.0.0.1:8787${SEGMENT}" -o public-segment.bin
          test -s public-segment.bin
          printf 'MP4=PASS\nHLS master rewrite=PASS\nHLS variant rewrite=PASS\nHLS segment=PASS\n' > public-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r001-public-smoke
          path: |
            paths.json
            mp4-headers.txt
            master.m3u8
            variant.m3u8
            public-smoke.txt
            server.log

  cleanup:
    name: J4 bounded abort-reconnect cleanup 100x
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Repeated bounded cleanup proof
        env:
          RUST_BACKTRACE: '1'
        run: cargo test -p gateway-core --test media_gateway repeated_cleanup_is_bounded -- --exact --nocapture
