name: env-arm64-github-smarthttp-prep

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to transport to the target"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: env-arm64-github-smarthttp-prep-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  SOURCE_BUNDLE_NAME: smarthttp-source-bundle-${{ inputs.candidate_sha }}

jobs:
  bundle:
    name: Create exact source bundle on hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate exact candidate input
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]

      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert candidate and credential boundary
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git config --local --get-regexp '(^credential\.|extraheader)' || true)"
          test ! -e .git-credentials
          test -z "$(find . -type f \( -name '.git-credentials' -o -name '.netrc' \) -print -quit)"
          echo "hosted_checkout_candidate=$CANDIDATE_SHA"
          echo "persisted_git_credentials=none"

      - name: Create deterministic source archive and manifest
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          bundle="$RUNNER_TEMP/smarthttp-source-bundle"
          mkdir -m 700 -p "$bundle"
          archive="$bundle/source-$CANDIDATE_SHA.tar"
          manifest="$bundle/manifest.json"
          git archive --format=tar --prefix=source/ HEAD --output="$archive"
          ARCHIVE="$archive" MANIFEST="$manifest" CANDIDATE_SHA="$CANDIDATE_SHA" \
            REPOSITORY="$REPOSITORY" WORKFLOW_NAME="$WORKFLOW_NAME" RUN_ID="$RUN_ID" RUN_ATTEMPT="$RUN_ATTEMPT" \
            python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import posixpath
          import subprocess
          import tarfile

          archive = pathlib.Path(os.environ["ARCHIVE"])
          manifest = pathlib.Path(os.environ["MANIFEST"])
          candidate = os.environ["CANDIDATE_SHA"].lower()

          def safe_relative(name: str) -> str:
              if not name.startswith("source/"):
                  raise SystemExit(f"archive member outside source prefix: {name!r}")
              rel = name[len("source/"):]
              parts = pathlib.PurePosixPath(rel).parts
              if not rel or pathlib.PurePosixPath(rel).is_absolute() or any(part in ("", ".", "..") for part in parts):
                  raise SystemExit(f"unsafe archive member: {name!r}")
              if ".git" in parts:
                  raise SystemExit("archive contains git metadata")
              return rel

          files = []
          seen = set()
          with tarfile.open(archive, "r:") as tar:
              for member in tar.getmembers():
                  if member.isdir():
                      if member.name.rstrip("/") != "source":
                          safe_relative(member.name.rstrip("/"))
                      continue
                  rel = safe_relative(member.name)
                  if rel in seen:
                      raise SystemExit(f"duplicate archive member: {rel}")
                  seen.add(rel)
                  if member.isfile():
                      stream = tar.extractfile(member)
                      data = stream.read() if stream is not None else b""
                      kind = "file"
                  elif member.issym():
                      target = member.linkname
                      if posixpath.isabs(target) or posixpath.normpath(posixpath.join(posixpath.dirname(rel), target)).startswith("../"):
                          raise SystemExit(f"unsafe symlink target: {rel!r}")
                      data = target.encode("utf-8", "surrogateescape")
                      kind = "symlink"
                  else:
                      raise SystemExit(f"unsupported archive member: {member.name!r}")
                  files.append({
                      "kind": kind,
                      "mode": f"{member.mode & 0o7777:04o}",
                      "path": rel,
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })

          files.sort(key=lambda item: item["path"])
          tree_sha = subprocess.run(
              ["git", "rev-parse", "HEAD^{tree}"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          payload = {
              "schema": 1,
              "repository": os.environ["REPOSITORY"],
              "candidate_sha": candidate,
              "tree_sha": tree_sha,
              "archive": archive.name,
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "creation": {
                  "workflow": os.environ["WORKFLOW_NAME"],
                  "run_id": os.environ["RUN_ID"],
                  "run_attempt": os.environ["RUN_ATTEMPT"],
              },
              "files": files,
          }
          if len(payload["candidate_sha"]) != 40 or len(payload["tree_sha"]) != 40:
              raise SystemExit("manifest identity is not a full commit/tree SHA")
          manifest.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"manifest_candidate={candidate}")
          print(f"manifest_tree={payload['tree_sha']}")
          print(f"manifest_archive={archive.name}")
          print(f"manifest_archive_sha256={payload['archive_sha256']}")
          print(f"manifest_files={len(files)}")
          print("bundle_git_state=absent")
          print("bundle_secret_state=not_present")
          PY

      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_BUNDLE_NAME }}
          path: ${{ runner.temp }}/smarthttp-source-bundle
          if-no-files-found: error
          retention-days: 7

  target:
    name: Diagnose Git transport and verify bundle on target
    needs: bundle
    if: needs.bundle.result == 'success'
    runs-on: [self-hosted, linux, ARM64, ubuntu-arm64, target-device]
    timeout-minutes: 25
    env:
      REMOTE_URL: https://github.com/liqiangcc/jellyfin-web-media-gateway.git
      AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Target pre-checkout identity and boundary
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "$AUTH_TOKEN"
          echo "candidate_sha=$CANDIDATE_SHA"
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "github_job=$GITHUB_JOB"
          uname -a
          uname -m
          id
          whoami
          git --version
          curl --version | sed -n '1p'
          echo "workspace=$GITHUB_WORKSPACE"
          echo "runner_temp=$RUNNER_TEMP"
          if [[ "$(id -u)" -eq 0 ]]; then
            echo "target job must not run as root"
            exit 1
          fi
          case "$GITHUB_WORKSPACE" in
            /var/lib/web-media-gateway|/var/lib/web-media-gateway/*)
              echo "runner workspace overlaps Gateway production state"
              exit 1
              ;;
          esac
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            echo "passwordless sudo is not allowed"
            exit 1
          fi
          vault=/var/lib/web-media-gateway/vault
          if [[ -e "$vault" && ( -r "$vault" || -x "$vault" ) ]]; then
            echo "target can access production Vault"
            exit 1
          fi
          if [[ -n "${HTTP_PROXY:-}${HTTPS_PROXY:-}${ALL_PROXY:-}${http_proxy:-}${https_proxy:-}${all_proxy:-}" ]]; then
            echo "runner_proxy_inheritance=present"
          else
            echo "runner_proxy_inheritance=none"
          fi
          echo "no repository checkout has occurred"
          printf '%s\n' "precheckout=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Download source bundle attempt 1 of 3
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ env.SOURCE_BUNDLE_NAME }}
          path: ${{ runner.temp }}/smarthttp-download-1

      - name: Download source bundle attempt 2 of 3
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ env.SOURCE_BUNDLE_NAME }}
          path: ${{ runner.temp }}/smarthttp-download-2

      - name: Download source bundle attempt 3 of 3
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ env.SOURCE_BUNDLE_NAME }}
          path: ${{ runner.temp }}/smarthttp-download-3

      - name: Classify smart HTTP and verify trusted source bundle
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          umask 077
          output_dir="$RUNNER_TEMP/smarthttp-target-output-$GITHUB_RUN_ID"
          mkdir -m 700 -p "$output_dir"
          work="$RUNNER_TEMP/smarthttp-probe-$GITHUB_RUN_ID"
          mkdir -m 700 -p "$work"
          trap 'rm -rf -- "$work"' EXIT
          : "${AUTH_TOKEN:?workflow token is unavailable}"
          printf 'candidate_sha=%s\n' "$CANDIDATE_SHA" > "$output_dir/summary.txt"
          printf 'remote=%s\n' "$REMOTE_URL" >> "$output_dir/summary.txt"

          run_ls_remote() {
            local mode="$1" log="$work/${1}-advertisement.log" rc
            set +e
            if [[ "$mode" == token ]]; then
              GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
                GIT_CONFIG_VALUE_0="AUTHORIZATION: bearer ${AUTH_TOKEN}" \
                GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c core.askPass= -c http.sslVerify=true \
                ls-remote --refs "$REMOTE_URL" > /dev/null 2>"$log"
            else
              GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c core.askPass= -c http.sslVerify=true \
                ls-remote --refs "$REMOTE_URL" > /dev/null 2>"$log"
            fi
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              printf '%s_advertisement=PASS\n' "$mode" | tee -a "$output_dir/summary.txt"
              return 0
            fi
            printf '%s_advertisement=FAIL\n' "$mode" | tee -a "$output_dir/summary.txt"
            return 1
          }

          run_fetch() {
            local mode="$1" variant="$2" repo="$work/${1}-${2}-repo" log="$work/${1}-${2}-fetch.log" rc actual
            mkdir -m 700 -p "$repo"
            git -C "$repo" init -q
            git -C "$repo" remote add origin "$REMOTE_URL"
            set +e
            if [[ "$mode" == token ]]; then
              GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
                GIT_CONFIG_VALUE_0="AUTHORIZATION: bearer ${AUTH_TOKEN}" \
                GIT_TERMINAL_PROMPT=0 git -C "$repo" -c credential.helper= -c core.askPass= \
                -c http.sslVerify=true -c "$variant" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA" > /dev/null 2>"$log"
            else
              GIT_TERMINAL_PROMPT=0 git -C "$repo" -c credential.helper= -c core.askPass= \
                -c http.sslVerify=true -c "$variant" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA" > /dev/null 2>"$log"
            fi
            rc=$?
            if [[ "$rc" -eq 0 ]]; then
              git -C "$repo" checkout -q --detach FETCH_HEAD
              actual="$(git -C "$repo" rev-parse HEAD)"
              if [[ "$actual" == "$CANDIDATE_SHA" ]]; then
                rc=0
              else
                rc=2
              fi
            fi
            set -e
            if [[ "$rc" -eq 0 ]]; then
              printf '%s_%s_fetch=PASS\n' "$mode" "$variant" | tee -a "$output_dir/summary.txt"
              rm -rf -- "$repo"
              return 0
            fi
            printf '%s_%s_fetch=FAIL\n' "$mode" "$variant" | tee -a "$output_dir/summary.txt"
            rm -rf -- "$repo"
            return 1
          }

          anonymous_advertisement=0
          token_advertisement=0
          anonymous_exact=1
          token_exact=1
          run_ls_remote anonymous || anonymous_advertisement=1
          run_ls_remote token || token_advertisement=1
          run_fetch anonymous protocol.version=2 || true
          if run_fetch token protocol.version=2; then token_exact=0; fi

          if [[ "$anonymous_advertisement" -eq 0 ]]; then
            # #89 already ruled out a generic advertisement failure; this is the
            # one anonymous exact-object comparison needed for the new layer.
            if run_fetch anonymous protocol.version=1; then anonymous_exact=0; fi
          fi
          if [[ "$token_exact" -ne 0 ]]; then
            # Bounded comparisons only: protocol v1 and HTTP/1.1, with TLS
            # verification and the ephemeral header unchanged.
            run_fetch token protocol.version=1 || true
            run_fetch token http.version=HTTP/1.1 || true
          fi

          if [[ "$anonymous_advertisement" -eq 0 && "$token_advertisement" -eq 0 && "$token_exact" -ne 0 ]]; then
            echo 'failure_layer=advertisement_pass_object_transfer_or_upload_pack_failure' | tee -a "$output_dir/summary.txt"
          elif [[ "$token_exact" -eq 0 ]]; then
            echo 'failure_layer=exact_object_transfer_passed' | tee -a "$output_dir/summary.txt"
          else
            echo 'failure_layer=connection_or_advertisement' | tee -a "$output_dir/summary.txt"
          fi

          if [[ "$token_exact" -eq 0 ]]; then
            smart_repetitions=0
            for attempt in 1 2 3; do
              if run_fetch token protocol.version=2; then
                smart_repetitions=$((smart_repetitions + 1))
              fi
            done
          else
            smart_repetitions=0
          fi
          printf 'smart_http_exact_fetch_3x=%s/3\n' "$smart_repetitions" | tee -a "$output_dir/summary.txt"
          if [[ "$smart_repetitions" -eq 3 ]]; then
            echo 'SMARTHTTP_RECOVERY_ELIGIBLE_FOR_#89=yes' | tee -a "$output_dir/summary.txt"
          else
            echo 'SMARTHTTP_RECOVERY_ELIGIBLE_FOR_#89=no' | tee -a "$OUTPUT_DIR/summary.txt"
          fi

          verify_bundle() {
            local bundle_root="$1" extract_root="$2"
            BUNDLE_ROOT="$bundle_root" EXTRACT_ROOT="$extract_root" EXPECTED_SHA="$CANDIDATE_SHA" \
              EXPECTED_REPOSITORY="${GITHUB_REPOSITORY}" python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import posixpath
          import stat
          import tarfile

          root = pathlib.Path(os.environ["BUNDLE_ROOT"])
          extract = pathlib.Path(os.environ["EXTRACT_ROOT"])
          expected_sha = os.environ["EXPECTED_SHA"].lower()
          expected_repo = os.environ["EXPECTED_REPOSITORY"]
          manifest_paths = list(root.rglob("manifest.json"))
          if len(manifest_paths) != 1:
              raise SystemExit("bundle must contain exactly one manifest")
          manifest_path = manifest_paths[0]
          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          if data.get("schema") != 1 or data.get("repository") != expected_repo:
              raise SystemExit("manifest schema/repository mismatch")
          if data.get("candidate_sha", "").lower() != expected_sha:
              raise SystemExit("manifest Candidate mismatch")
          archive = root / data["archive"]
          if not archive.is_file() or archive.name != data["archive"]:
              raise SystemExit("manifest archive is missing")
          archive_hash = hashlib.sha256(archive.read_bytes()).hexdigest()
          if archive_hash != data["archive_sha256"]:
              raise SystemExit("archive SHA256 mismatch")

          def relative(name: str) -> str:
              if not name.startswith("source/"):
                  raise SystemExit("archive member is outside source prefix")
              rel = name[len("source/"):]
              parts = pathlib.PurePosixPath(rel).parts
              if not rel or pathlib.PurePosixPath(rel).is_absolute() or any(part in ("", ".", "..") for part in parts):
                  raise SystemExit("unsafe archive path")
              if ".git" in parts:
                  raise SystemExit("archive contains .git state")
              return rel

          actual_files = []
          members = []
          with tarfile.open(archive, "r:") as tar:
              for member in tar.getmembers():
                  if member.isdir():
                      if member.name.rstrip("/") != "source":
                          relative(member.name.rstrip("/"))
                      continue
                  rel = relative(member.name)
                  if member.isfile():
                      stream = tar.extractfile(member)
                      content = stream.read() if stream is not None else b""
                      kind = "file"
                  elif member.issym():
                      if posixpath.isabs(member.linkname) or posixpath.normpath(posixpath.join(posixpath.dirname(rel), member.linkname)).startswith("../"):
                          raise SystemExit("unsafe symlink target")
                      content = member.linkname.encode("utf-8", "surrogateescape")
                      kind = "symlink"
                  else:
                      raise SystemExit("unsupported archive member")
                  actual_files.append({"kind": kind, "mode": f"{member.mode & 0o7777:04o}", "path": rel, "sha256": hashlib.sha256(content).hexdigest()})
                  members.append(member)
          actual_files.sort(key=lambda item: item["path"])
          if actual_files != data.get("files"):
              raise SystemExit("manifest file proof mismatch")

          extract.mkdir(mode=0o700, parents=True)
          source = extract / "source"
          source.mkdir(mode=0o700)
          with tarfile.open(archive, "r:") as tar:
              for member in members:
                  rel = relative(member.name)
                  destination = extract / "source" / rel
                  destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  if member.isfile():
                      stream = tar.extractfile(member)
                      destination.write_bytes(stream.read() if stream is not None else b"")
                  else:
                      os.symlink(member.linkname, destination)
                  if member.isfile():
                      os.chmod(destination, member.mode & 0o7777)

          expected_paths = {item["path"] for item in actual_files}
          for item in actual_files:
              path = source / item["path"]
              if item["kind"] == "symlink":
                  if not path.is_symlink():
                      raise SystemExit("symlink missing after extraction")
                  content = os.readlink(path).encode("utf-8", "surrogateescape")
              else:
                  if not path.is_file() or path.is_symlink():
                      raise SystemExit("regular file missing after extraction")
                  content = path.read_bytes()
              if hashlib.sha256(content).hexdigest() != item["sha256"]:
                  raise SystemExit("extracted file hash mismatch")
              if f"{stat.S_IMODE(path.stat(follow_symlinks=False).st_mode):04o}" != item["mode"]:
                  raise SystemExit("extracted file mode mismatch")
          for current, dirs, files in os.walk(source, followlinks=False):
              current_path = pathlib.Path(current)
              for name in files + dirs:
                  rel = (current_path / name).relative_to(source).as_posix()
                  if rel not in expected_paths:
                      raise SystemExit("unexpected extracted path")
          if any(path.name in {".git", ".git-credentials", ".netrc"} for path in extract.rglob("*")):
              raise SystemExit("credential or git state found after extraction")
          print(f"bundle_verified_candidate={expected_sha}")
          print(f"bundle_verified_files={len(actual_files)}")
          print(f"bundle_verified_archive_sha256={data['archive_sha256']}")
          PY
          }

          bundle_success=0
          for attempt in 1 2 3; do
            if verify_bundle "$RUNNER_TEMP/smarthttp-download-$attempt" "$work/extract-$attempt"; then
              bundle_success=$((bundle_success + 1))
            else
              echo "bundle_attempt_${attempt}=FAIL" | tee -a "$output_dir/summary.txt"
            fi
          done
          printf 'trusted_source_bundle_verify_3x=%s/3\n' "$bundle_success" | tee -a "$output_dir/summary.txt"
          if [[ "$bundle_success" -eq 3 ]]; then
            echo 'TRUSTED_SOURCE_BUNDLE_ELIGIBLE_FOR_#85=yes' | tee -a "$output_dir/summary.txt"
          else
            echo 'TRUSTED_SOURCE_BUNDLE_ELIGIBLE_FOR_#85=no' | tee -a "$output_dir/summary.txt"
            exit 1
          fi
          echo "token_persistence=command_scoped_only" | tee -a "$output_dir/summary.txt"
          echo "tls_verification=enabled" | tee -a "$output_dir/summary.txt"
          unset AUTH_TOKEN

      - name: Upload sanitized target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smarthttp-target-evidence-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/smarthttp-target-output-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7

      - name: Clean target temporary state
        if: always()
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          rm -rf -- "$RUNNER_TEMP/smarthttp-probe-$GITHUB_RUN_ID" \
            "$RUNNER_TEMP/smarthttp-download-1" \
            "$RUNNER_TEMP/smarthttp-download-2" \
            "$RUNNER_TEMP/smarthttp-download-3"
          test ! -e "$RUNNER_TEMP/smarthttp-probe-$GITHUB_RUN_ID"
          test ! -e "$RUNNER_TEMP/smarthttp-download-1"
          test ! -e "$RUNNER_TEMP/smarthttp-download-2"
          test ! -e "$RUNNER_TEMP/smarthttp-download-3"
          test -z "$(git config --global --get-regexp '(^credential\.|extraheader)' || true)"
          echo "target_temporary_state=clean"
          echo "global_git_secret_config=absent"
