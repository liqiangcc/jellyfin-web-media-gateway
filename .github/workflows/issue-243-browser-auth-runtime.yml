name: issue-243-browser-auth-runtime

on:
  pull_request:
    paths:
      - 'gateway-core/**'
      - 'site-adapter-api/**'
      - 'plugins/bilibili/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/issue-243-browser-auth-runtime.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact Candidate SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: issue-243-browser-auth-runtime-${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}

jobs:
  j1-auth-contract:
    name: 'Issue #243 J1 hosted x64 auth contract'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate candidate identity
        shell: bash
        run: |
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]

      - name: Checkout exact Candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Assert exact Candidate SHA
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Generic auth/API lifecycle tests
        run: |
          cargo test -p site-adapter-api --all-targets -- --nocapture
          cargo test -p gateway-core --lib browser_auth::tests -- --nocapture
          cargo test -p gateway-core --lib auth::tests -- --nocapture

      - name: Browser, Bilibili, R008 and Playback regressions
        run: |
          cargo test -p bilibili --all-targets -- --nocapture
          cargo test -p gateway-core --lib browser::tests -- --nocapture
          cargo test -p gateway-core --lib browser_chromium::tests -- --nocapture
          cargo test -p gateway-core --test auth_contract -- --nocapture
          cargo test -p gateway-core --test security_baseline -- --nocapture
          cargo test -p gateway-core --test playback_concurrency -- --nocapture

      - name: Full x64 workspace integration suite
        run: cargo test --workspace --all-targets -- --test-threads=1

  j2-auth-regressions:
    name: 'Issue #243 J2 hosted x64 lifecycle and security regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate candidate identity
        shell: bash
        run: |
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]

      - name: Checkout exact Candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Assert exact Candidate SHA
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Auth runtime lifecycle and plugin consumer tests
        run: |
          cargo test -p site-adapter-api --all-targets -- --nocapture
          cargo test -p gateway-core --lib browser_auth::tests -- --nocapture
          cargo test -p gateway-core --lib auth::tests -- --nocapture
          cargo test -p bilibili --all-targets -- --nocapture

      - name: Browser, R008 and Playback regressions
        run: |
          cargo test -p gateway-core --lib browser::tests -- --nocapture
          cargo test -p gateway-core --lib browser_chromium::tests -- --nocapture
          cargo test -p gateway-core --test auth_contract -- --nocapture
          cargo test -p gateway-core --test security_baseline -- --nocapture
          cargo test -p gateway-core --test playback_concurrency -- --nocapture

      - name: Core and Browser Worker remain site agnostic
        shell: bash
        run: |
          ! git grep -n -i -E 'bilibili|sessdata|BV[0-9A-Za-z]{10}' -- gateway-core/src/browser.rs gateway-core/src/browser_chromium.rs gateway-core/src/browser_auth.rs
          ! git grep -n -E 'Fetch\.(getResponseBody|takeResponseBodyAsStream)|Network\.getResponseBody|Set-Cookie|Authorization' -- gateway-core/src/browser.rs gateway-core/src/browser_chromium.rs gateway-core/src/browser_auth.rs

      - name: Secret and unsafe browser-boundary guards
        shell: bash
        run: |
          ! git grep -n -E -- '--no-sandbox|--proxy-server|--remote-debugging-address=0\.0\.0\.0' -- gateway-core/src/browser_chromium.rs
          ! git grep -n -E 'pub[[:space:]]+.*(cookie|authorization|bearer|signed.?url|profile.?path)' -- gateway-core/src/browser_auth.rs site-adapter-api/src/lib.rs plugins/bilibili/src/lib.rs
