name: issue-259-generic-browser-auth-experience

on:
  push:
    branches:
      - "worker/issue-259-generic-browser-auth-experience"
  pull_request:
    paths:
      - "gateway-core/**"
      - "gateway-runtime/**"
      - "site-adapter-api/**"
      - ".github/workflows/issue-259-generic-browser-auth-experience.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: issue-259-generic-browser-auth-experience-${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}

jobs:
  contract:
    name: Issue 259 hosted x64 fmt clippy tests and guards
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Assert exact candidate SHA and hosted x64
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(uname -m)" = x86_64
          rustc_info="$(rustc -vV)"
          [[ "$rustc_info" == *'host: x86_64-unknown-linux-gnu'* ]]
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-targets -- --test-threads=1
      - name: Focused auth and Control contract tests
        run: |
          cargo test -p gateway-core --lib auth_route::tests -- --nocapture
          cargo test -p gateway-core --test http_security -- --nocapture
      - name: Architecture and secret-boundary guards
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          bash scripts/check-core-site-boundary.sh --self-test
          if git grep -n -i -E 'bilibili|sessdata|BV[0-9A-Za-z]{10,}' -- gateway-core/src/auth_route.rs gateway-core/src/browser_auth.rs gateway-core/src/control.rs gateway-core/src/control_view.rs; then
            echo 'concrete site knowledge leaked into the generic auth/control surface' >&2
            exit 1
          fi
          if git grep -n -E 'pub[^\n]*(cookie_header|authorization_header|local_storage|browser_profile|profile_path|profile_dir)' -- gateway-core/src/auth_route.rs gateway-core/src/control.rs gateway-core/src/control_view.rs; then
            echo 'Secret/profile material crossed the public auth/control boundary' >&2
            exit 1
          fi
          if git grep -n -E 'VNC|remote-debugging|clipboard|file-upload|audio-capture|Network\.getResponseBody' -- gateway-core/src/auth_route.rs gateway-core/src/lib.rs; then
            echo 'forbidden browser transport or capability leaked into auth/control' >&2
            exit 1
          fi

  stale-and-security:
    name: Issue 259 stale, capability, and boundary guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Assert exact candidate SHA and hosted x64
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(uname -m)" = x86_64
      - name: Focused stale and auth lifecycle tests
        run: |
          cargo test -p gateway-core --lib auth_route::tests::fake_coordinator_start_is_idempotent_and_cancel_cleans_attempt -- --exact --nocapture
          cargo test -p gateway-core --lib browser_auth::tests -- --nocapture
          cargo test -p gateway-core --test auth_contract -- --nocapture
      - name: HTTP boundary and DTO guards
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          if git grep -n -E 'pub[^\n]*(Cookie|Authorization|Bearer|profile[_-]?(path|bytes|dir)|raw[_-]?cdp|vnc)' -- gateway-core/src/auth_route.rs gateway-core/src/control.rs gateway-core/src/control_view.rs; then
            echo 'secret or raw browser transport vocabulary crossed the public DTO boundary' >&2
            exit 1
          fi

  artifact-log-boundary:
    name: Issue 259 hosted x64 artifact, log, and public boundary guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact candidate SHA and hosted x64
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(uname -m)" = x86_64
      - name: Create bounded provenance artifact and redacted guard log
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          evidence_dir="$GITHUB_WORKSPACE/issue-259-j3-evidence"
          mkdir -p "$evidence_dir"
          sha256sum \
            gateway-core/src/auth_route.rs \
            gateway-core/src/browser_auth.rs \
            gateway-core/src/control.rs \
            gateway-core/src/control_view.rs \
            gateway-core/src/lib.rs \
            .github/workflows/issue-259-generic-browser-auth-experience.yml \
            > "$evidence_dir/source-sha256sums.txt"
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "git_head=$(git rev-parse HEAD)"
            echo "runner_arch=$(uname -m)"
            echo "artifact_scope=generic-auth-control-public-boundary"
            echo "secret_policy=redacted-only"
            echo "log_policy=bounded-pass-fail"
          } > "$evidence_dir/manifest.txt"
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "public_boundary_guard=PASS"
            echo "artifact_provenance_guard=PASS"
            echo "log_redaction_guard=PASS"
          } > "$evidence_dir/guard.log"
      - name: Verify bounded artifact, log, and public boundary provenance
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          evidence_dir="$GITHUB_WORKSPACE/issue-259-j3-evidence"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          grep -Fx "candidate_sha=$CANDIDATE_SHA" "$evidence_dir/manifest.txt"
          grep -Fx "git_head=$CANDIDATE_SHA" "$evidence_dir/manifest.txt"
          grep -Fx "candidate_sha=$CANDIDATE_SHA" "$evidence_dir/guard.log"
          (cd "$GITHUB_WORKSPACE" && sha256sum -c issue-259-j3-evidence/source-sha256sums.txt)
          if git grep -q -E 'pub[^\n]*(Cookie|Authorization|Bearer|profile[_-]?(path|bytes|dir)|raw[_-]?cdp|vnc)' -- gateway-core/src/auth_route.rs gateway-core/src/control.rs gateway-core/src/control_view.rs; then
            echo 'secret or raw browser transport vocabulary crossed the public DTO boundary' >&2
            exit 1
          fi
          if git grep -q -i -E 'bilibili|sessdata|BV[0-9A-Za-z]{10,}' -- gateway-core/src/auth_route.rs gateway-core/src/browser_auth.rs gateway-core/src/control.rs gateway-core/src/control_view.rs; then
            echo 'concrete site knowledge crossed the generic auth/control boundary' >&2
            exit 1
          fi
          if grep -Eiq 'Cookie|Authorization|Bearer|localStorage|profile[_-]?(path|bytes|dir)|raw[_-]?cdp|VNC' "$evidence_dir"; then
            echo 'bounded J3 artifact or guard log contains forbidden secret/browser transport vocabulary' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-259-j3-evidence-${{ env.CANDIDATE_SHA }}
          path: issue-259-j3-evidence
          if-no-files-found: error
          retention-days: 14
