name: generic-ytdlp-prep

on:
  push:
    branches:
      - "worker/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "site-adapter-api/**"
      - "plugins/generic-direct/**"
      - "plugins/generic-ytdlp/**"
      - "scripts/generic-ytdlp-runtime-cache.py"
      - "scripts/generic-ytdlp-real-smoke.sh"
      - "scripts/test-generic-ytdlp-clean-build.sh"
      - "scripts/tests/test_generic_ytdlp_runtime_cache.py"
      - "gateway-egress/**"
      - "gateway-core/**"
      - "display-adapter-api/**"
      - "scripts/check-core-site-boundary.sh"
      - "scripts/fixtures/core-site-boundary-*.rs"
      - ".github/workflows/generic-ytdlp-prep.yml"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: generic-ytdlp-prep-${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
  PYTHON: python

jobs:
  j1-conformance:
    name: J1 hosted x86_64 clean build and sandbox matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact Candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Assert x86_64 execution target
        shell: bash --noprofile --norc -euo pipefail {0}
        run: test "$(uname -m)" = x86_64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Assert x86_64 Rust target
        run: |
          rustc -vV | grep -q 'host: x86_64-unknown-linux-gnu'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare exact frozen user-owned cache
        run: |
          cache_root="$RUNNER_TEMP/generic-ytdlp-cache"
          export XDG_CACHE_HOME="$cache_root"
          python scripts/generic-ytdlp-runtime-cache.py invalidate
          cache_info="$(python scripts/generic-ytdlp-runtime-cache.py prepare)"
          mapfile -t cache_lines <<<"$cache_info"
          test "${cache_lines[0]}" = prepared
          test -n "${cache_lines[1]}"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_root" >> "$GITHUB_ENV"
          printf 'YTDLP_SOURCE=%s\n' "${cache_lines[1]}" >> "$GITHUB_ENV"
      - name: Verify cold/warm cache, offline reuse and proxy separation
        run: |
          warm_info="$(HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 ALL_PROXY=http://127.0.0.1:9 PIP_NO_INDEX=1 python scripts/generic-ytdlp-runtime-cache.py prepare)"
          mapfile -t warm_lines <<<"$warm_info"
          test "${warm_lines[0]}" = hit
          test -n "${warm_lines[1]}"
          PYTHONPATH="$YTDLP_SOURCE" python -c 'import os, pathlib, yt_dlp; assert yt_dlp.version.__version__ == "2026.08.19"; assert pathlib.Path(yt_dlp.__file__).resolve().is_relative_to(pathlib.Path(os.environ["YTDLP_SOURCE"]).resolve())'
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v
          PYTHONPATH="$YTDLP_SOURCE" python plugins/generic-ytdlp/tests/worker_normalization_test.py
      - name: Run conformance, parser and direct-priority tests
        run: |
          bash scripts/test-generic-ytdlp-clean-build.sh
          cargo fmt --all -- --check
          cargo clippy -p generic-ytdlp --all-targets -- -D warnings
          cargo test -p gateway-egress --all-targets -- --nocapture
          cargo test -p site-adapter-api --all-targets -- --nocapture
          cargo test -p generic-direct --all-targets -- --nocapture
          cargo test -p generic-ytdlp --all-targets -- --nocapture
          cargo test -p generic-ytdlp --features runtime-prep --test smoke -- --nocapture
          cargo test -p generic-ytdlp --features runtime-prep --test runtime -- --nocapture
          cargo test -p generic-ytdlp --features runtime-prep --bin ytdlp-sandbox -- --nocapture
          bash -n scripts/generic-ytdlp-real-smoke.sh

  j2-boundaries:
    name: J2 native hosted ARM64 clean build and sandbox matrix
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact Candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Assert AArch64 execution target
        shell: bash --noprofile --norc -euo pipefail {0}
        run: test "$(uname -m)" = aarch64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Assert AArch64 Rust target
        run: |
          rustc -vV | grep -q 'host: aarch64-unknown-linux-gnu'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare exact frozen user-owned cache
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/generic-ytdlp-cache"
          python scripts/generic-ytdlp-runtime-cache.py invalidate
          cache_info="$(python scripts/generic-ytdlp-runtime-cache.py prepare)"
          mapfile -t cache_lines <<<"$cache_info"
          test "${cache_lines[0]}" = prepared
          printf 'XDG_CACHE_HOME=%s\n' "$XDG_CACHE_HOME" >> "$GITHUB_ENV"
          printf 'YTDLP_SOURCE=%s\n' "${cache_lines[1]}" >> "$GITHUB_ENV"
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v
          PYTHONPATH="$YTDLP_SOURCE" python plugins/generic-ytdlp/tests/worker_normalization_test.py
      - name: Run bounded process and parser negatives
        run: |
          bash scripts/test-generic-ytdlp-clean-build.sh
          cargo test -p generic-ytdlp --all-targets -- --nocapture
          cargo test -p generic-ytdlp --features runtime-prep --test smoke safe_broker -- --nocapture
          cargo test -p generic-ytdlp --features runtime-prep --test runtime -- --nocapture
          cargo test -p generic-ytdlp --features runtime-prep --bin ytdlp-sandbox -- --nocapture
      - name: Verify no Core yt-dlp/process fallback and no network client
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          ! grep -RInE 'yt-dlp|ytdlp|std::process|Command::new|reqwest|TcpStream' gateway-core/src
          ! grep -RInE 'curl_cffi|websockets|ftp://|file://' plugins/generic-ytdlp/worker
          ! grep -RInE --exclude='generic-ytdlp-real-smoke.rs' 'gateway-core|reqwest|EgressPolicy|R008Broker' plugins/generic-ytdlp/src plugins/generic-ytdlp/Cargo.toml
          grep -q 'R008Broker' gateway-egress/src/lib.rs
          grep -q 'R008Broker::default' plugins/generic-ytdlp/src/bin/generic-ytdlp-real-smoke.rs
          grep -q 'target_arch = "x86_64"' plugins/generic-ytdlp/src/bin/ytdlp-sandbox.rs
          grep -q 'target_arch = "aarch64"' plugins/generic-ytdlp/src/bin/ytdlp-sandbox.rs
          grep -q 'AUDIT_ARCH_AARCH64' plugins/generic-ytdlp/src/bin/ytdlp-sandbox.rs
          grep -q 'CURRENT_AUDIT_ARCH' plugins/generic-ytdlp/src/bin/ytdlp-sandbox.rs
          grep -q 'compile_error!' plugins/generic-ytdlp/src/bin/ytdlp-sandbox.rs
          grep -q 'libc::SYS_socket as u32' plugins/generic-ytdlp/src/bin/ytdlp-sandbox.rs
          grep -q 'libc::SYS_socketpair as u32' plugins/generic-ytdlp/src/bin/ytdlp-sandbox.rs
          grep -q 'SYS_socketpair' plugins/generic-ytdlp/src/bin/ytdlp-sandbox.rs
          grep -q 'DisabledRunner' plugins/generic-ytdlp/src/lib.rs
          bash scripts/check-core-site-boundary.sh
          bash scripts/check-core-site-boundary.sh --self-test

  j3-regressions:
    name: J3 security and static guards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact Candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare exact frozen user-owned cache
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/generic-ytdlp-cache"
          python scripts/generic-ytdlp-runtime-cache.py invalidate
          cache_info="$(python scripts/generic-ytdlp-runtime-cache.py prepare)"
          mapfile -t cache_lines <<<"$cache_info"
          test "${cache_lines[0]}" = prepared
          printf 'XDG_CACHE_HOME=%s\n' "$XDG_CACHE_HOME" >> "$GITHUB_ENV"
          printf 'YTDLP_SOURCE=%s\n' "${cache_lines[1]}" >> "$GITHUB_ENV"
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Run exact-Candidate workspace and affected regressions
        run: |
          cargo test -p gateway-core --test security_baseline -- --nocapture
          cargo test -p gateway-core --test media_gateway -- --nocapture
          cargo test -p gateway-egress --all-targets -- --nocapture
          cargo test -p generic-ytdlp --features runtime-prep --test runtime r008_broker_rejects_secret_userinfo_and_private_targets_before_network -- --nocapture
          ! grep -RInE 'YTDLP_SANDBOX|SANDBOX_PATH|PATH.*ytdlp-sandbox|unsandboxed' scripts/generic-ytdlp-real-smoke.sh plugins/generic-ytdlp/src
          grep -q -- '--bin ytdlp-sandbox' scripts/generic-ytdlp-real-smoke.sh
          grep -q 'symlink_metadata' plugins/generic-ytdlp/src/bin/generic-ytdlp-real-smoke.rs
          grep -q 'Arc::new(DisabledRunner)' plugins/generic-ytdlp/src/lib.rs
          bash -n scripts/generic-ytdlp-real-smoke.sh
          bash -n scripts/test-generic-ytdlp-clean-build.sh
          bash scripts/check-core-site-boundary.sh
          bash scripts/check-core-site-boundary.sh --self-test

      - name: Verify warm cache remains usable without setup network
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          warm_info="$(HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 ALL_PROXY=http://127.0.0.1:9 PIP_NO_INDEX=1 python scripts/generic-ytdlp-runtime-cache.py prepare)"
          mapfile -t warm_lines <<<"$warm_info"
          test "${warm_lines[0]}" = hit
          PYTHONPATH="$YTDLP_SOURCE" python -c 'import yt_dlp; assert yt_dlp.version.__version__ == "2026.08.19"'

  j4-lifecycle-regressions:
    name: J4 full affected regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate candidate identity
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact Candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare exact frozen user-owned cache
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/generic-ytdlp-cache"
          python scripts/generic-ytdlp-runtime-cache.py invalidate
          cache_info="$(python scripts/generic-ytdlp-runtime-cache.py prepare)"
          mapfile -t cache_lines <<<"$cache_info"
          test "${cache_lines[0]}" = prepared
          printf 'XDG_CACHE_HOME=%s\n' "$XDG_CACHE_HOME" >> "$GITHUB_ENV"
          printf 'YTDLP_SOURCE=%s\n' "${cache_lines[1]}" >> "$GITHUB_ENV"
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Run lifecycle, parser and DisabledRunner proof
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo test -p gateway-egress --all-targets
          cargo test -p generic-ytdlp --features runtime-prep --test runtime -- --nocapture
          python -m py_compile plugins/generic-ytdlp/worker/worker.py
          grep -q 'Arc::new(DisabledRunner)' plugins/generic-ytdlp/src/lib.rs
          bash scripts/check-core-site-boundary.sh
          bash scripts/check-core-site-boundary.sh --self-test
