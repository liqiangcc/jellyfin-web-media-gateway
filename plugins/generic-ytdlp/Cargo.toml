[package]
name = "generic-ytdlp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
runtime-prep = [
    "dep:gateway-core",
    "dep:futures-util",
    "dep:libc",
    "dep:reqwest",
    "dep:tokio",
]

[dependencies]
gateway-core = { path = "../../gateway-core", optional = true }
futures-util = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
site-adapter-api = { path = "../../site-adapter-api" }
tokio = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
generic-direct = { path = "../generic-direct" }

[[bin]]
name = "ytdlp-sandbox"
path = "src/bin/ytdlp-sandbox.rs"
required-features = ["runtime-prep"]
