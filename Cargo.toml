[workspace]
members = [
  "site-adapter-api",
  "plugins/generic-direct",
  "gateway-core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
async-stream = "0.3.6"
axum = "0.8.4"
bytes = "1.10.1"
futures-util = "0.3.31"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.47.1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5.4"
uuid = { version = "1.18.0", features = ["v4"] }
