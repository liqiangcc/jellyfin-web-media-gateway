[package]
name = "gateway-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "gateway-server"
path = "src/bin/gateway-server.rs"

[dependencies]
axum.workspace = true
bilibili = { path = "../plugins/bilibili" }
gateway-core = { path = "../gateway-core" }
generic-direct = { path = "../plugins/generic-direct" }
generic-ytdlp = { path = "../plugins/generic-ytdlp" }
site-adapter-api = { path = "../site-adapter-api" }
tokio.workspace = true
url.workspace = true

[dev-dependencies]
gateway-core = { path = "../gateway-core", features = ["test-support"] }
serde_json.workspace = true
tower.workspace = true
